<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dial España</title>
<meta name="description" content="Radios nacionales de España en directo">
<meta name="theme-color" content="#ECEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1215" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Concepto: caja de radio de cabina. Tarjetas grandes y táctiles para elegir, y un panel inferior con escala de sintonía y aguja. */
  --bg:#ECEEF0; --surface:#FFFFFF; --ink:#14181C; --muted:#586169; --line:#D2D7DC;
  --accent:#A85400; --accent-ink:#FFFFFF; --tint:#FBEBD6;
  --panel:#14181C; --panel-ink:#ECEFF1; --panel-muted:#8F9AA3; --glow:#FFB020;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1215; --surface:#171B1F; --ink:#ECEFF1; --muted:#98A2AB; --line:#272D33;
    --accent:#FFB020; --accent-ink:#1A1200; --tint:#2A2212; --panel:#0A0C0E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1215; --surface:#171B1F; --ink:#ECEFF1; --muted:#98A2AB; --line:#272D33;
  --accent:#FFB020; --accent-ink:#1A1200; --tint:#2A2212; --panel:#0A0C0E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:70rem;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) 11rem}
header{display:grid;gap:.9rem;margin-bottom:1.2rem}
h1{margin:0;font:800 clamp(2.4rem,9vw,3.6rem)/.9 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
h1 span{color:var(--accent)}
.sub{margin:.3rem 0 0;color:var(--muted)}
.search input{width:100%;min-height:3.25rem;padding:.7rem 1rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--muted)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tabs button{min-height:3rem;padding:.5rem 1.1rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs b{font-family:var(--f-mono);font-weight:500;margin-left:.35rem}

.group{margin:0 0 1.6rem}
.group h2{margin:0 0 .6rem;font:700 1.35rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
ul.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:.6rem}
.row{display:flex;align-items:stretch;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.row.on{background:var(--tint);border-color:var(--accent)}
.row .play{flex:1;min-width:0;display:flex;align-items:center;gap:.8rem;padding:.6rem .8rem;min-height:4.25rem;border:0;background:none;text-align:left}
.logo{flex:none;width:2.9rem;height:2.9rem;border-radius:6px;background:var(--bg);display:grid;place-items:center;overflow:hidden;font:800 1.2rem/1 var(--f-display);color:var(--muted)}
.logo img{width:100%;height:100%;object-fit:contain}
.txt{min-width:0;display:grid;gap:.1rem}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{flex:none;width:3.5rem;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center}
.fav svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:2}
.fav.is{color:var(--accent)}
.fav.is svg{fill:currentColor}
.eq{display:none;flex:none;gap:2px;align-items:flex-end;height:1rem}
.row.on .eq{display:flex}
.eq i{width:3px;height:100%;background:var(--accent);transform-origin:bottom;animation:eq 0.9s ease-in-out infinite alternate;animation-play-state:paused}
.playing .row.on .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}

.msg{padding:1.5rem 0;color:var(--muted)}
.msg.err{color:var(--ink)}
.more{display:block;margin:1.2rem auto 0;min-height:3rem;padding:.5rem 1.4rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}
.foot{margin:2rem 0 0;font-size:.8rem;color:var(--muted)}

.player{position:fixed;left:0;right:0;bottom:0;background:var(--panel);color:#ECEFF1;padding:.7rem max(16px,env(safe-area-inset-right,0px)) max(.8rem,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid #2B3238}
.player-in{max-width:70rem;margin:0 auto;display:grid;gap:.6rem}
.dial{position:relative;height:1.6rem;opacity:.9;
  background:
    repeating-linear-gradient(90deg,var(--panel-muted) 0 1px,transparent 1px 12px) left bottom/100% 9px no-repeat,
    repeating-linear-gradient(90deg,var(--panel-muted) 0 2px,transparent 2px 60px) left bottom/100% 18px no-repeat}
.needle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;margin-left:-1px;background:var(--glow);box-shadow:0 0 10px var(--glow);transition:left .7s cubic-bezier(.2,.8,.2,1)}
.now{display:flex;align-items:center;gap:.8rem;min-width:0}
.now .logo{background:#222930;color:#9AA4AD;width:3.4rem;height:3.4rem}
.now .info{flex:1;min-width:0;display:grid;gap:.1rem}
.now .title{font:700 1.4rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .status{font:500 .78rem var(--f-mono);color:var(--panel-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .status.live{color:var(--glow)}
.now .status.bad{color:#FF8A7A}
.ctl{display:flex;align-items:center;gap:.5rem;flex:none}
.ctl button{width:3.25rem;height:3.25rem;border-radius:50%;border:1px solid #39424A;background:#1C2228;color:#ECEFF1;display:grid;place-items:center}
.ctl button svg{width:1.4rem;height:1.4rem;fill:currentColor}
.ctl .main{width:4.5rem;height:4.5rem;background:var(--glow);border-color:var(--glow);color:#1A1200}
.ctl .main svg{width:1.9rem;height:1.9rem}
.ctl button[disabled]{opacity:.4;cursor:default}
@media (max-width:30rem){
  .ctl .skip{width:2.75rem;height:2.75rem}
  .ctl .main{width:4rem;height:4rem}
  .now .logo{display:none}
}
@media (prefers-reduced-motion:reduce){.needle{transition:none}.eq i{animation:none;transform:scaleY(.7)}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>Dial <span>España</span></h1>
      <p class="sub" id="sub">Radios nacionales en directo</p>
    </div>
    <label class="search">
      <span class="sr">Buscar emisora</span>
      <input id="q" type="search" placeholder="Buscar emisora, ciudad o género" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="tabs" role="tablist" aria-label="Listas">
      <button role="tab" type="button" data-tab="nat" aria-selected="true">Nacionales</button>
      <button role="tab" type="button" data-tab="fav" aria-selected="false">Favoritas<b id="nfav"></b></button>
      <button role="tab" type="button" data-tab="all" aria-selected="false">Todas</button>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
  <p class="foot" id="foot"></p>
</div>

<section class="player" id="player" aria-label="Reproductor">
  <div class="player-in">
    <div class="dial" aria-hidden="true"><div class="needle" id="needle"></div></div>
    <div class="now">
      <div class="logo" id="plogo"></div>
      <div class="info">
        <div class="title" id="ptitle">Elige una emisora</div>
        <div class="status" id="pstatus">Toca una emisora para escucharla</div>
      </div>
      <div class="ctl">
        <button type="button" class="skip" id="prev" aria-label="Emisora anterior" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button type="button" class="main" id="toggle" aria-label="Reproducir" disabled></button>
        <button type="button" class="skip" id="next" aria-label="Emisora siguiente" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  var HOSTS = [
    'https://de1.api.radio-browser.info',
    'https://de2.api.radio-browser.info',
    'https://fi1.api.radio-browser.info',
    'https://nl1.api.radio-browser.info'
  ];
  var HTTPS = location.protocol === 'https:';
  var CACHE_KEY = 'dial.all.v1';
  var CACHE_MS = 24 * 3600 * 1000;

  // Emisoras nacionales: se buscan por nombre en el directorio, así las direcciones de streaming se mantienen al día.
  var NATIONAL = [
    { g: 'Información y tertulia', items: [
      { n: 'Cadena SER', re: [/^cadena ser$/i, /^cadena ser( |-|$)/i] },
      { n: 'COPE', re: [/^cope$/i, /^cadena cope$/i, /^cope( |-)/i] },
      { n: 'Onda Cero', re: [/^onda cero$/i, /^onda cero( |-)/i] },
      { n: 'RNE Radio Nacional', re: [/^radio nacional/i, /^rne.*radio 1/i, /^radio 1\b/i] },
      { n: 'RNE Radio 5', re: [/radio 5\b/i] },
      { n: 'esRadio', re: [/^es ?radio/i] },
      { n: 'Radio Marca', re: [/radio marca/i] },
      { n: 'Radio Exterior', re: [/radio exterior/i] }
    ]},
    { g: 'Música', items: [
      { n: 'LOS40', re: [/^los ?40$/i, /^los ?40 (espa|principales)/i, /^los ?40( |-)(?!classic|dance|urban)/i] },
      { n: 'LOS40 Classic', re: [/los ?40 classic/i] },
      { n: 'LOS40 Dance', re: [/los ?40 dance/i] },
      { n: 'LOS40 Urban', re: [/los ?40 urban/i] },
      { n: 'Cadena 100', re: [/^cadena ?100/i] },
      { n: 'Cadena Dial', re: [/^cadena dial/i] },
      { n: 'Europa FM', re: [/^europa fm$/i, /^europa fm( |-)/i] },
      { n: 'Kiss FM', re: [/^kiss fm$/i, /^kiss fm( |-)/i] },
      { n: 'Rock FM', re: [/^rock fm$/i, /^rock fm( |-)/i] },
      { n: 'M80 Radio', re: [/^m80/i] },
      { n: 'Melodía FM', re: [/melod[ií]a fm/i] },
      { n: 'Onda Melodía', re: [/onda melod/i] },
      { n: 'Máxima FM', re: [/m[aá]xima fm/i] },
      { n: 'Radiolé', re: [/radiol[eé]|radio ol[eé]/i] },
      { n: 'Hit FM', re: [/^hit fm/i] }
    ]},
    { g: 'Cultura', items: [
      { n: 'RNE Radio 3', re: [/^radio 3\b/i, /^rne.*radio 3/i] },
      { n: 'RNE Radio Clásica', re: [/radio cl[aá]sica/i] }
    ]}
  ];

  var state = {
    all: [], pool: [], groups: [], missing: [],
    tab: 'nat', q: '', shown: 150,
    favs: read('dial.favs', []), cur: read('dial.last', null),
    list: [], playing: false, want: false
  };

  var $ = function (s) { return document.querySelector(s); };

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.append(c.nodeType ? c : document.createTextNode(c));
    }
    return el;
  }
  function read(key, def) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }
  function write(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* sin espacio o bloqueado */ }
  }
  var norm = function (s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
  var secureOk = function (u) { return !HTTPS || /^https:/i.test(u); };

  var ICON_HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.4 3 5 6.4 5c2 0 3.6 1.1 5.6 3.2C14 6.1 15.600 5 17.600 5 21 5 23 8.400 21.500 11.800 19.500 16.400 12 21 12 21z" stroke-linejoin="round"/></svg>';
  var ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.500v15l13-7.500z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

  /* ---------- datos ---------- */
  async function api(path) {
    var start = Math.floor(Math.random() * HOSTS.length), err;
    for (var i = 0; i < HOSTS.length; i++) {
      try {
        var r = await fetch(HOSTS[(start + i) % HOSTS.length] + path, { headers: { Accept: 'application/json' } });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return await r.json();
      } catch (e) { err = e; }
    }
    throw err;
  }
  function slim(s) {
    return { id: s.stationuuid, name: String(s.name || '').trim(), u: s.url_resolved || s.url,
      f: s.favicon || '', t: s.tags || '', s: s.state || '', c: s.clickcount || 0,
      b: s.bitrate || 0, k: s.codec || '' };
  }
  function prep() {
    state.pool = state.all.filter(function (s) { return s.name && s.u && secureOk(s.u); });
    var used = {};
    state.missing = [];
    state.groups = NATIONAL.map(function (grp) {
      var items = [];
      grp.items.forEach(function (it) {
        var found = null;
        for (var i = 0; i < it.re.length && !found; i++) {
          found = state.pool.find(function (s) { return !used[s.id] && it.re[i].test(s.name); });
        }
        if (found) {
          used[found.id] = 1;
          items.push(Object.assign({}, found, { name: it.n, g: grp.g }));
        } else state.missing.push(it.n);
      });
      return { g: grp.g, items: items };
    });
  }
  async function init() {
    var c = read(CACHE_KEY, null);
    if (c && c.data && c.data.length) { state.all = c.data; prep(); render(); }
    else showMsg('Cargando emisoras…');
    if (c && Date.now() - c.t < CACHE_MS) return;
    try {
      var qs = 'countrycode=ES&hidebroken=true&order=clickcount&reverse=true&limit=3000';
      var raw = await api('/json/stations/search?' + qs);
      state.all = raw.map(slim);
      write(CACHE_KEY, { t: Date.now(), data: state.all });
      prep(); render();
    } catch (e) {
      if (!state.all.length) showMsg('No se pudo cargar la lista de emisoras. Comprueba la conexión y vuelve a abrir la app.', true);
    }
  }

  /* ---------- lista ---------- */
  function showMsg(text, err) {
    var m = $('#main'); m.replaceChildren(h('p', { class: 'msg' + (err ? ' err' : '') }, text));
  }
  function filt(arr) {
    var q = norm(state.q).trim();
    if (!q) return arr;
    return arr.filter(function (s) { return norm(s.name + ' ' + s.s + ' ' + s.t).indexOf(q) > -1; });
  }
  function isFav(id) { return state.favs.some(function (f) { return f.id === id; }); }
  function toggleFav(st) {
    if (isFav(st.id)) state.favs = state.favs.filter(function (f) { return f.id !== st.id; });
    else state.favs.push({ id: st.id, name: st.name, u: st.u, f: st.f, t: st.t, s: st.s, c: st.c, b: st.b, k: st.k });
    write('dial.favs', state.favs);
    render(true);
  }
  function initials(name) {
    var w = name.replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).filter(Boolean);
    return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
  }
  function logo(st, el) {
    el.replaceChildren();
    if (st.f && secureOk(st.f)) {
      var img = h('img', { src: st.f, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
      img.addEventListener('error', function () { el.replaceChildren(initials(st.name)); });
      el.append(img);
    } else el.append(initials(st.name));
    return el;
  }
  function metaOf(st) {
    var parts = [];
    if (st.g) parts.push(st.g);
    else if (st.s) parts.push(st.s);
    if (st.k && st.b) parts.push(st.k + ' ' + st.b + ' kbps');
    return parts.join(' · ');
  }
  function card(st) {
    var on = state.cur && state.cur.id === st.id;
    var fav = isFav(st.id);
    return h('li', { class: 'row' + (on ? ' on' : '') },
      h('button', { class: 'play', type: 'button', 'aria-label': 'Escuchar ' + st.name, onclick: function () { start(st); } },
        logo(st, h('span', { class: 'logo' })),
        h('span', { class: 'txt' }, h('span', { class: 'nm' }, st.name), h('span', { class: 'meta' }, metaOf(st))),
        h('span', { class: 'eq', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'))),
      (function () {
        var b = h('button', { class: 'fav' + (fav ? ' is' : ''), type: 'button', 'aria-pressed': String(fav),
          'aria-label': (fav ? 'Quitar de favoritas ' : 'Añadir a favoritas ') + st.name, onclick: function () { toggleFav(st); } });
        b.innerHTML = ICON_HEART;
        return b;
      })());
  }
  function render(keepScroll) {
    var y = window.scrollY;
    var main = $('#main'); main.replaceChildren();
    var total = 0, flat = [];
    $('#nfav').textContent = state.favs.length ? state.favs.length : '';

    if (state.tab === 'nat') {
      state.groups.forEach(function (grp) {
        var items = filt(grp.items);
        if (!items.length) return;
        flat = flat.concat(items); total += items.length;
        main.append(h('section', { class: 'group' }, h('h2', null, grp.g), h('ul', { class: 'grid' }, items.map(card))));
      });
    } else {
      var src = state.tab === 'fav' ? state.favs : state.pool;
      var all = filt(src);
      var items = state.tab === 'all' ? all.slice(0, state.shown) : all;
      flat = items; total = all.length;
      if (items.length) main.append(h('ul', { class: 'grid' }, items.map(card)));
      if (state.tab === 'all' && all.length > items.length) {
        main.append(h('button', { class: 'more', type: 'button', onclick: function () { state.shown += 150; render(true); } },
          'Mostrar más (' + (all.length - items.length) + ')'));
      }
    }
    if (!total) {
      var q = state.q.trim();
      var text = q ? 'Ninguna emisora coincide con «' + q + '».'
        : state.tab === 'fav' ? 'Aún no tienes favoritas. Toca el corazón de cualquier emisora para guardarla aquí.'
        : 'No hay emisoras para mostrar.';
      main.append(h('p', { class: 'msg' }, text));
    }
    state.view = flat;
    $('#sub').textContent = state.tab === 'all'
      ? state.pool.length + ' emisoras de España' : state.tab === 'nat' ? 'Radios nacionales en directo' : 'Tus emisoras guardadas';
    var foot = 'Emisoras y direcciones de Radio Browser, un directorio abierto mantenido por la comunidad.';
    if (state.tab === 'nat' && state.missing.length) foot += ' No se han encontrado ahora: ' + state.missing.join(', ') + '.';
    $('#foot').textContent = foot;
    if (keepScroll) window.scrollTo(0, y);
  }

  /* ---------- reproductor ---------- */
  var audio = new Audio();
  audio.preload = 'none';
  var retries = 0, retryT = 0;

  function setStatus(text, cls) {
    var s = $('#pstatus'); s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : '');
  }
  function needlePos(st) {
    var n = 0, i;
    for (i = 0; i < st.name.length; i++) n = (n * 31 + st.name.charCodeAt(i)) % 1000;
    return 4 + (n / 1000) * 92;
  }
  function ui() {
    var st = state.cur;
    document.body.classList.toggle('playing', state.playing);
    var t = $('#toggle');
    t.disabled = !st;
    t.innerHTML = state.playing || state.want ? ICON_PAUSE : ICON_PLAY;
    t.setAttribute('aria-label', state.playing || state.want ? 'Pausar' : 'Reproducir');
    $('#prev').disabled = $('#next').disabled = !st || state.list.length < 2;
    if (st) {
      $('#ptitle').textContent = st.name;
      logo(st, $('#plogo'));
      $('#needle').style.setProperty('--pos', needlePos(st) + '%');
    }
  }
  function mediaSession(st) {
    if (!('mediaSession' in navigator) || !window.MediaMetadata) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: st.name, artist: 'Dial España',
      artwork: st.f && secureOk(st.f) ? [{ src: st.f }] : []
    });
  }
  function load() {
    audio.src = state.cur.u;
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
  }
  function start(st) {
    clearTimeout(retryT); retries = 0;
    state.cur = st; state.want = true;
    state.list = state.view && state.view.length ? state.view.slice() : [st];
    write('dial.last', { id: st.id, name: st.name, u: st.u, f: st.f, t: st.t, s: st.s, b: st.b, k: st.k, g: st.g });
    setStatus('Conectando…');
    load(); ui(); mediaSession(st); render(true);
    try { fetch(HOSTS[0] + '/json/url/' + encodeURIComponent(st.id), { mode: 'no-cors' }).catch(function () {}); } catch (e) {}
  }
  function pause() {
    clearTimeout(retryT); state.want = false; audio.pause(); audio.removeAttribute('src'); audio.load();
    state.playing = false; setStatus('En pausa'); ui();
  }
  function toggle() {
    if (!state.cur) return;
    if (state.playing || state.want) pause();
    else { state.want = true; retries = 0; setStatus('Conectando…'); load(); ui(); }
  }
  function step(d) {
    if (!state.cur || state.list.length < 2) return;
    var i = state.list.findIndex(function (s) { return s.id === state.cur.id; });
    var next = state.list[(i + d + state.list.length) % state.list.length];
    var keep = state.list;
    start(next); state.list = keep; ui();
  }
  audio.addEventListener('playing', function () { retries = 0; state.playing = true; setStatus('EN DIRECTO' + (state.cur && state.cur.b ? ' · ' + state.cur.b + ' kbps' : ''), 'live'); ui(); render(true); });
  audio.addEventListener('waiting', function () { if (state.want) setStatus('Cargando…'); });
  audio.addEventListener('pause', function () { state.playing = false; ui(); });
  function recover() {
    if (!state.want || !state.cur) return;
    if (retries < 5) {
      retries++;
      setStatus('Reconectando… (' + retries + '/5)');
      clearTimeout(retryT);
      retryT = setTimeout(function () { if (state.want) load(); }, 2000 * retries);
    } else {
      state.want = false; state.playing = false;
      setStatus('No se puede reproducir esta emisora. Prueba otra.', 'bad'); ui();
    }
  }
  audio.addEventListener('error', recover);
  audio.addEventListener('ended', recover);
  audio.addEventListener('stalled', function () {
    if (!state.want) return;
    clearTimeout(retryT);
    retryT = setTimeout(function () { if (state.want && !state.playing) recover(); }, 8000);
  });
  window.addEventListener('online', function () { if (state.want && !state.playing) { retries = 0; load(); } });

  if ('mediaSession' in navigator) {
    var set = function (a, fn) { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
    set('play', toggle); set('pause', toggle);
    set('nexttrack', function () { step(1); }); set('previoustrack', function () { step(-1); });
  }

  /* ---------- eventos ---------- */
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.tab = b.dataset.tab; state.shown = 150;
      document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
      render(); window.scrollTo(0, 0);
    });
  });
  var qt = 0;
  $('#q').addEventListener('input', function (e) {
    clearTimeout(qt);
    qt = setTimeout(function () { state.q = e.target.value; state.shown = 150; render(true); }, 120);
  });
  $('#toggle').addEventListener('click', toggle);
  $('#prev').addEventListener('click', function () { step(-1); });
  $('#next').addEventListener('click', function () { step(1); });

  if (state.cur) { state.list = [state.cur]; setStatus('Toca reproducir para continuar'); }
  ui();
  init();

  if ('serviceWorker' in navigator && (HTTPS || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
